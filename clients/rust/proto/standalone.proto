syntax = "proto3";
package mongot.standalone.v1;
option java_multiple_files = true;
option java_package = "com.xgen.mongot.standalone.grpc";

// Push mode manages indexes only. Mapping updates replace an index with an empty generation;
// callers must reingest their source content. There is no source document store or replay log.
service CatalogService {
  rpc CreateIndex(CreateIndexRequest) returns (IndexDescription);
  rpc UpdateIndex(UpdateIndexRequest) returns (IndexDescription);
  rpc DropIndex(DropIndexRequest) returns (IndexDescription);
  rpc GetIndex(GetIndexRequest) returns (IndexDescription);
  rpc GetIndexMappings(GetIndexMappingsRequest) returns (GetIndexMappingsResponse);
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
}
service DocumentService {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
service OperationsService { rpc GetStatus(GetStatusRequest) returns (ServiceStatus); }
service QueryService {
  rpc Search(QueryRequest) returns (QueryResponse);
  rpc VectorSearch(QueryRequest) returns (QueryResponse);
  rpc GetMore(GetMoreRequest) returns (QueryResponse);
  rpc KillCursor(KillCursorRequest) returns (KillCursorResponse);
}
enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  INDEX_TYPE_SEARCH = 1;
  INDEX_TYPE_VECTOR_SEARCH = 2;
}
message CreateIndexRequest {
  string name = 1;
  IndexType type = 2;
  bytes definition_bson = 3;
}
message UpdateIndexRequest {
  string index_id = 1;
  uint64 expected_revision = 2;
  bytes definition_bson = 3;
}
message DropIndexRequest { string index_id = 1; uint64 expected_revision = 2; }
message GetIndexRequest { string index_id = 1; }
message GetIndexMappingsRequest {
  string index_id = 1;
  string generation_id = 2; // Optional fence against a schema change.
}
// Search indexes only. Refreshes the reader before inspecting every partition's field metadata.
// Includes configured fields and observed dynamic types; dynamic is false at every document level.
// Metadata can retain deleted fields until segment merges. Null-only fields, empty objects/arrays,
// and values that never produced a typed Lucene field cannot be inferred from this snapshot.
message GetIndexMappingsResponse {
  string index_id = 1;
  string generation_id = 2;
  uint64 active_revision = 3;
  string mappings_json = 4; // Public mappings object, including dynamic and fields.
  // Complete public definition with mappings replaced by mappings_json. Parse as Extended JSON,
  // encode as BSON, and pass to CreateIndex/UpdateIndex; preserves analyzers and other options.
  string definition_json = 5;
}
message ListIndexesRequest {}
message ListIndexesResponse { repeated IndexDescription indexes = 1; }
message IndexDescription {
  string index_id = 1;
  string name = 2;
  IndexType type = 3;
  uint64 desired_revision = 4;
  bytes desired_definition_bson = 5;
  string lifecycle_state = 6;
  string generation_id = 7;
  uint64 active_revision = 8;
  string failure_message = 9;
}
enum DocumentWriteConcern {
  // Successful completion means a fresh search can observe the writes.
  DOCUMENT_WRITE_CONCERN_VISIBLE = 0;
  // Applied to the Lucene writer; crash recovery can lose uncommitted writes.
  DOCUMENT_WRITE_CONCERN_INDEXED = 1;
  // Persisted in Lucene; visibility follows the refresh interval.
  DOCUMENT_WRITE_CONCERN_COMMITTED = 2;
}
// Full BSON replacements with a client-assigned _id, written to exactly one index.
// Batches are ordered, not atomic. On failure/disconnect a prefix may have been applied.
// Repeating an upsert/delete is safe in isolation; callers order retries against newer writes.
message UpsertRequest {
  string index_id = 1;
  repeated bytes documents_bson = 2;
  string generation_id = 3; // Optional fence against a schema change.
  DocumentWriteConcern write_concern = 4;
}
message UpsertResponse { string index_id = 1; string generation_id = 2; uint32 indexed_count = 3; }
message DeleteRequest {
  string index_id = 1;
  repeated bytes ids_bson = 2; // Each is a complete BSON document containing exactly {_id: value}.
  string generation_id = 3;
  DocumentWriteConcern write_concern = 4;
}
// Count is the number of processed IDs; Lucene does not report prior source existence.
message DeleteResponse { string index_id = 1; string generation_id = 2; uint32 processed_count = 3; }
message QueryRequest {
  string index_id = 1;
  bytes query_bson = 2;
  uint32 batch_size = 3;
  string generation_id = 4;
}
message QueryResponse {
  uint64 cursor_id = 1;
  bytes batch_bson = 2;
  bytes metadata_bson = 3;
  string generation_id = 4;
}
message GetMoreRequest { uint64 cursor_id = 1; uint32 batch_size = 2; }
message KillCursorRequest { uint64 cursor_id = 1; }
message KillCursorResponse {}
message GetStatusRequest {}
message ServiceStatus {
  bool management_ready = 1;
  string failure_message = 2;
  repeated IndexDescription indexes = 3;
  uint64 free_disk_bytes = 4;
  repeated ServiceMetric metrics = 5;
}
message ServiceMetric {
  string name = 1;
  map<string,string> labels = 2;
  map<string,double> measurements = 3;
}
