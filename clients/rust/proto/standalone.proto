syntax = "proto3";
package mongot.standalone.v1;
option java_multiple_files = true;
option java_package = "com.xgen.mongot.standalone.grpc";

// Push mode manages indexes only. Mapping updates replace an index with an empty generation;
// callers must reingest their source content. There is no source document store or replay log.
service CatalogService {
  rpc CreateIndex(CreateIndexRequest) returns (IndexDescription);
  rpc UpdateIndex(UpdateIndexRequest) returns (IndexDescription);
  rpc DropIndex(DropIndexRequest) returns (IndexDescription);
  rpc GetIndex(GetIndexRequest) returns (IndexDescription);
  rpc GetIndexMappings(GetIndexMappingsRequest) returns (GetIndexMappingsResponse);
  rpc GetIndexStats(GetIndexStatsRequest) returns (IndexStats);
  rpc GetIndexFieldStats(GetIndexFieldStatsRequest) returns (IndexFieldStatsResponse);
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
}
service DocumentService {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
service OperationsService { rpc GetStatus(GetStatusRequest) returns (ServiceStatus); }
service QueryService {
  rpc Search(QueryRequest) returns (QueryResponse);
  rpc VectorSearch(QueryRequest) returns (QueryResponse);
  rpc GetMore(GetMoreRequest) returns (QueryResponse);
  rpc KillCursor(KillCursorRequest) returns (KillCursorResponse);
}
enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  INDEX_TYPE_SEARCH = 1;
  INDEX_TYPE_VECTOR_SEARCH = 2;
}
message CreateIndexRequest {
  string name = 1;
  IndexType type = 2;
  bytes definition_bson = 3;
}
message UpdateIndexRequest {
  string index_id = 1;
  uint64 expected_revision = 2;
  bytes definition_bson = 3;
}
message DropIndexRequest { string index_id = 1; uint64 expected_revision = 2; }
message GetIndexRequest { string index_id = 1; }
message GetIndexMappingsRequest {
  string index_id = 1;
  string generation_id = 2; // Optional fence against a schema change.
}
// Search indexes only. Refreshes the reader before inspecting every partition's field metadata.
// Includes configured fields and observed dynamic types; dynamic is false at every document level.
// Metadata can retain deleted fields until segment merges. Null-only fields, empty objects/arrays,
// and values that never produced a typed Lucene field cannot be inferred from this snapshot.
message GetIndexMappingsResponse {
  string index_id = 1;
  string generation_id = 2;
  uint64 active_revision = 3;
  string mappings_json = 4; // Public mappings object, including dynamic and fields.
  // Complete public definition with mappings replaced by mappings_json. Parse as Extended JSON,
  // encode as BSON, and pass to CreateIndex/UpdateIndex; preserves analyzers and other options.
  string definition_json = 5;
}
message ListIndexesRequest {}

// Statistics require catalog role and a grant for this index. Refresh is visible, not a commit.
message GetIndexStatsRequest {
  string index_id = 1;
  string generation_id = 2;
  bool refresh = 3;
}
enum MeasurementMethod {
  MEASUREMENT_METHOD_UNAVAILABLE = 0;
  MEASUREMENT_METHOD_FILE_RANGE = 1;
  MEASUREMENT_METHOD_RESOURCE_ACCOUNTING = 2;
  MEASUREMENT_METHOD_CODEC_WORKING_SET = 3;
  MEASUREMENT_METHOD_MODEL_ESTIMATE = 4;
}
enum MeasurementCompleteness {
  MEASUREMENT_COMPLETENESS_UNAVAILABLE = 0;
  MEASUREMENT_COMPLETENESS_COMPLETE = 1;
  MEASUREMENT_COMPLETENESS_PARTIAL = 2;
}
message ByteMeasurement {
  optional uint64 value = 1; // Absent is unavailable; zero is a supported measurement of zero.
  MeasurementMethod method = 2;
  MeasurementCompleteness completeness = 3;
  repeated string included_components = 4;
  repeated string omitted_components = 5;
}
// These domains must not be added together as actual RAM/RSS. Off-heap is desired capacity.
message IndexMemoryStats {
  ByteMeasurement accounted_reader_heap_bytes = 1;
  ByteMeasurement accounted_writer_buffer_heap_bytes = 2;
  ByteMeasurement accounted_cache_heap_bytes = 3;
  ByteMeasurement desired_vector_off_heap_bytes = 4;
}
message IndexStats {
  string index_id = 1;
  string generation_id = 2;
  uint64 active_revision = 3;
  string snapshot_id = 4;
  uint64 sampled_at_unix_millis = 5;
  uint64 document_count = 6; // Live root/source documents, excluding embedded children.
  uint64 lucene_document_count = 7;
  uint64 deleted_lucene_document_count = 8;
  uint64 index_size_bytes = 9; // Unique physical segment files referenced by the pinned snapshot.
  ByteMeasurement directory_size_bytes = 10; // Separate, non-atomic sample, including retained files.
  uint64 directory_sampled_at_unix_millis = 11;
  optional double average_index_bytes_per_document = 12; // Absent for an empty index.
  optional double average_directory_bytes_per_document = 13;
  IndexMemoryStats memory = 14;
  uint64 memory_sampled_at_unix_millis = 15;
  uint64 age_millis = 16;
}
message GetIndexFieldStatsRequest {
  string index_id = 1;
  string generation_id = 2;
  bool refresh = 3;
  repeated string paths = 4; // Exact canonical paths; filters select rows, not the global ledger.
  uint32 page_size = 5; // Default 100, maximum 500, also bounded by serialized response size.
  string page_token = 6; // Bound to principal, generation, filters, size and immutable snapshot.
}
enum StatsCollectionState {
  STATS_COLLECTION_STATE_COLLECTING = 0;
  STATS_COLLECTION_STATE_READY = 1;
}
message FieldRepresentationStats {
  string physical_name = 1;
  string mapping_type = 2;
  string multi = 3;
  string embedded_root = 4;
  ByteMeasurement attributed_disk_bytes = 5;
  ByteMeasurement accounted_reader_heap_bytes = 6;
  ByteMeasurement desired_vector_off_heap_bytes = 7;
  map<string, uint64> vector_working_set_categories = 8;
}
message IndexFieldStats {
  string path = 1;
  bool configured = 2;
  bool observed = 3;
  ByteMeasurement attributed_disk_bytes = 4;
  ByteMeasurement accounted_reader_heap_bytes = 5;
  ByteMeasurement desired_vector_off_heap_bytes = 6;
  repeated FieldRepresentationStats representations = 7;
}
message StorageStatsBucket {
  string component = 1;
  repeated string owners = 2;
  uint64 bytes = 3;
  bool unattributed = 4;
  string reason = 5;
  uint64 owner_count = 6;
  bool owner_list_complete = 7; // Owner name samples are bounded; bytes/totals are never truncated.
}
message MemoryStatsBucket {
  string component = 1;
  repeated string owners = 2;
  ByteMeasurement bytes = 3;
  uint64 owner_count = 4;
  bool owner_list_complete = 5;
}
message IndexFieldStatsResponse {
  StatsCollectionState state = 1;
  IndexStats index_stats = 2; // Present only when READY; summary belongs to this field snapshot.
  repeated IndexFieldStats fields = 3;
  uint64 total_attributed_disk_bytes = 4; // Global totals, independent of filter and page.
  uint64 shared_disk_bytes = 5;
  uint64 unattributed_disk_bytes = 6;
  optional double attribution_coverage = 7;
  repeated StorageStatsBucket storage_buckets = 8;
  repeated MemoryStatsBucket memory_buckets = 9;
  string next_page_token = 10;
  bool refresh_in_progress = 11;
  uint32 retry_after_millis = 12;
}
message ListIndexesResponse { repeated IndexDescription indexes = 1; }
message IndexDescription {
  string index_id = 1;
  string name = 2;
  IndexType type = 3;
  uint64 desired_revision = 4;
  bytes desired_definition_bson = 5;
  string lifecycle_state = 6;
  string generation_id = 7;
  uint64 active_revision = 8;
  string failure_message = 9;
}
enum DocumentWriteConcern {
  // Successful completion means a fresh search can observe the writes.
  DOCUMENT_WRITE_CONCERN_VISIBLE = 0;
  // Applied to the Lucene writer; crash recovery can lose uncommitted writes.
  DOCUMENT_WRITE_CONCERN_INDEXED = 1;
  // Persisted in Lucene; visibility follows the refresh interval.
  DOCUMENT_WRITE_CONCERN_COMMITTED = 2;
}
// Full BSON replacements with a client-assigned _id, written to exactly one index.
// Batches are ordered, not atomic. On failure/disconnect a prefix may have been applied.
// Repeating an upsert/delete is safe in isolation; callers order retries against newer writes.
message UpsertRequest {
  string index_id = 1;
  repeated bytes documents_bson = 2;
  string generation_id = 3; // Optional fence against a schema change.
  DocumentWriteConcern write_concern = 4;
}
message UpsertResponse { string index_id = 1; string generation_id = 2; uint32 indexed_count = 3; }
message DeleteRequest {
  string index_id = 1;
  repeated bytes ids_bson = 2; // Each is a complete BSON document containing exactly {_id: value}.
  string generation_id = 3;
  DocumentWriteConcern write_concern = 4;
}
// Count is the number of processed IDs; Lucene does not report prior source existence.
message DeleteResponse { string index_id = 1; string generation_id = 2; uint32 processed_count = 3; }
message QueryRequest {
  string index_id = 1;
  bytes query_bson = 2;
  uint32 batch_size = 3;
  string generation_id = 4;
}
message QueryResponse {
  uint64 cursor_id = 1;
  bytes batch_bson = 2;
  bytes metadata_bson = 3;
  string generation_id = 4;
}
message GetMoreRequest { uint64 cursor_id = 1; uint32 batch_size = 2; }
message KillCursorRequest { uint64 cursor_id = 1; }
message KillCursorResponse {}
message GetStatusRequest {}
message ServiceStatus {
  bool management_ready = 1;
  string failure_message = 2;
  repeated IndexDescription indexes = 3;
  uint64 free_disk_bytes = 4;
  repeated ServiceMetric metrics = 5;
}
message ServiceMetric {
  string name = 1;
  map<string,string> labels = 2;
  map<string,double> measurements = 3;
}
