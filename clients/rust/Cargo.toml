[package]
name = "mongot-standalone-client"
version = "0.5.0"
edition = "2021"
description = "Typed BSON/gRPC client for standalone mongot"
license = "SSPL-1.0"
readme = "README.md"
repository = "https://github.com/beardsandbeers/nomongo-t"
include = ["src/**", "proto/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "rustfmt.toml"]

[dependencies]
tonic = { version = "0.12.3", features = ["tls", "tls-roots"] }
prost = "0.13.5"
pbjson = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bson = "2.15"

[build-dependencies]
tonic-build = "0.12.3"
pbjson-build = "0.7"
protoc-bin-vendored = "3"
