[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mongot-standalone-client"
version = "0.3.0"
requires-python = ">=3.10"
description = "BSON-aware gRPC client for standalone mongot"
readme = "README.md"
license = "SSPL-1.0"
license-files = ["LICENSE"]
dependencies = ["grpcio>=1.85.1,<2", "protobuf>=7.36.2,<8", "pymongo>=4.10,<5"]

[project.optional-dependencies]
codegen = ["grpcio-tools==1.85.1"]

[project.urls]
Repository = "https://github.com/beardsandbeers/nomongo-t"
Documentation = "https://github.com/beardsandbeers/nomongo-t/blob/main/clients/README.md"

[project.scripts]
mongot-client = "mongot_standalone.cli:main"

[tool.setuptools.packages.find]
include = ["mongot_standalone*"]

[tool.setuptools.package-data]
mongot_standalone = ["*.pyi", "py.typed"]
